name: codealpha_flashcard_quiz
description: A professional Flashcard Quiz App for CodeAlpha Internship.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  fluttertoast: ^8.2.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true

  image_path: assets/icons/app_icon.png

  adaptive_icon_background: "#1A1833"
  adaptive_icon_foreground: assets/icons/app_icon.png

flutter:
  uses-material-design: true